<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>瀬戸田町非公認キャラクター - ししレモン & レモシシくん</title>
  <link rel="stylesheet" href="style.css">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <header class="header">
    <h1 class="main-title">瀬戸田町非公認キャラクター</h1>
    <p class="sub-title">Unofficial Character of Setoda</p>
  </header>

  <main class="container">
    <p class="instruction">＼ タップして次のカードへ ／</p>

    <!-- マルチカードデッキ本体 -->
    <div class="card-container" id="cardContainer">
      <div class="card-deck" id="cardDeck">
        
        <!-- 1枚目: shishilemon-1.jpg -->
        <div class="card-item active" data-index="0">
          <div class="card-inner">
            <img src="shishilemon-1.jpg" alt="ししレモン 1">
          </div>
        </div>

        <!-- 2枚目: shishilemon-2.jpg -->
        <div class="card-item" data-index="1">
          <div class="card-inner">
            <img src="shishilemon-2.jpg" alt="ししレモン 2">
          </div>
        </div>

        <!-- 3枚目: shishilemon-2B.jpg -->
        <div class="card-item" data-index="1">
          <div class="card-inner">
            <img src="shishilemon-2B.jpg" alt="ししレモン 2背">
          </div>
        </div>

        <!-- 4枚目: shishilemon-3.jpg -->
        <div class="card-item" data-index="3">
          <div class="card-inner">
            <img src="shishilemon-3.jpg" alt="ししレモン 3">
          </div>
        </div>

        <!-- 5枚目: shishilemon-4.jpg -->
        <div class="card-item" data-index="4">
          <div class="card-inner">
            <img src="shishilemon-4.jpg" alt="ししレモン 4">
          </div>
        </div>

        <!-- 6枚目: shishilemon-5.jpg -->
        <div class="card-item" data-index="5">
          <div class="card-inner">
            <img src="shishilemon-5.jpg" alt="ししレモン 5">
          </div>
        </div>
        
       <!-- 7枚目: shishilemon-S1 -->
        <div class="card-item" data-index="6">
          <div class="card-inner">
            <img src="shishilemon-S1.jpg" alt="ししレモン S1">
          </div>
        </div>

       <!-- 8枚目: shishilemon-S2.jpg -->
        <div class="card-item" data-index="7">
          <div class="card-inner">
            <img src="shishilemon-S2.jpg" alt="ししレモン S2">
          </div>
        </div>

        <!-- 9枚目: lemoshishi.jpg -->
        <div class="card-item" data-index="8">
          <div class="card-inner">
            <img src="lemoshishi-A.jpg" alt="レモシシくん">
          </div>
        </div>

        <!-- 10枚目: lemoshishi.jpg -->
        <div class="card-item" data-index="9">
          <div class="card-inner">
            <img src="lemoshishi-B.jpg" alt="レモシシくん背">
          </div>
        </div>

      </div>
    </div>

    <!-- ページネーション（インジケータードット） -->
    <div class="dots-container" id="dotsContainer">
      <span class="dot active" data-index="0"></span>
      <span class="dot" data-index="1"></span>
      <span class="dot" data-index="2"></span>
      <span class="dot" data-index="3"></span>
      <span class="dot" data-index="4"></span>
      <span class="dot" data-index="5"></span>
      <span class="dot" data-index="6"></span>
      <span class="dot" data-index="7"></span>
      <span class="dot" data-index="8"></span>
      <span class="dot" data-index="9"></span>      
    </div>

    <!-- 外部リンクボタンエリア -->
    <div class="links-container">
      <a href="https://shishilemon.stores.jp/" target="_blank" rel="noopener noreferrer" class="link-btn site-btn">
        <span>ししレモン ONLINE STORE</span>
      </a>
 <a href="https://www.instagram.com/shishilemon.setoda/" target="_blank" rel="noopener noreferrer" class="link-btn instagram-btn">
        <i class="fa-brands fa-instagram"></i>
        <span>ししレモン Instagram</span>
      </a>

      <a href="https://www.tabitasu.net" target="_blank" rel="noopener noreferrer" class="link-btn site-btn">
        <i class="fa-solid fa-globe"></i>
        <span>たびたすツアーズ WEBSITE</span>
      </a>

    </div>
  </main>

  <footer class="footer">
    <p>&copy; SHISHILEMON & LEMOSHISHI</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
